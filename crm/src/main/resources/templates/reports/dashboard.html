<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CRM Reports Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #eef2f7, #f8fafc);
            margin: 0;
            padding: 25px;
        }

        h2 {
            margin-bottom: 20px;
            font-weight: 600;
            color: #2c3e50;
        }

        /* EXPORT BUTTON */
        .export-btn {
            margin-bottom: 25px;
        }

        .export-btn a {
            text-decoration: none;
            padding: 10px 18px;
            background: linear-gradient(135deg, #3498db, #6dd5fa);
            color: white;
            border-radius: 8px;
            font-weight: 500;
        }

        /* CARDS */
        .card-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            position: relative;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        .card h1 {
            margin: 10px 0;
            font-size: 28px;
            color: #2c3e50;
        }

        .indicator {
            font-size: 13px;
            font-weight: 500;
        }

        .up { color: #2ecc71; }
        .down { color: #e74c3c; }

        /* CHARTS */
        .chart-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .chart-box {
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        .chart-box.full {
            grid-column: span 2;
        }

        .chart-title {
            margin-bottom: 15px;
            font-weight: 600;
            color: #444;
        }

        /* FIX GRAPH SIZE */
        canvas {
            max-height: 250px !important;
        }
    </style>
</head>

<body>

<h2>📊 CRM Reports Dashboard</h2>

<div class="export-btn">
    <a href="/enquiry/export">⬇ Export Enquiries (Excel)</a>
</div>

<!-- SUMMARY CARDS -->
<div class="card-container">

    <div class="card">
        <h3>Total Enquiries</h3>
        <h1 th:text="${total}">0</h1>
        <div class="indicator up">⬆ +12% this week</div>
    </div>

    <div class="card">
        <h3>Converted</h3>
        <h1 th:text="${converted}">0</h1>
        <div class="indicator up">⬆ +8% growth</div>
    </div>

    <div class="card">
        <h3>Conversion Rate</h3>
        <h1 th:text="${rate} + '%'">0%</h1>
        <div class="indicator down">⬇ -2% drop</div>
    </div>

</div>

<!-- CHARTS -->
<div class="chart-container">

    <div class="chart-box">
        <div class="chart-title">📌 Status Distribution</div>
        <canvas id="statusChart"></canvas>
    </div>

    <div class="chart-box">
        <div class="chart-title">📚 Course Interest</div>
        <canvas id="courseChart"></canvas>
    </div>

    <div class="chart-box full">
        <div class="chart-title">📈 Daily Enquiries Trend</div>
        <canvas id="dailyChart"></canvas>
    </div>

</div>

<script>
// COMMON OPTIONS (PREVENT STRETCH)
const options = {
    responsive: true,
    maintainAspectRatio: true,
    plugins: {
        legend: {
            position: 'bottom'
        }
    }
};

// STATUS PIE
fetch('/reports/status')
.then(res => res.json())
.then(data => {
    new Chart(document.getElementById('statusChart'), {
        type: 'doughnut',
        data: {
            labels: Object.keys(data),
            datasets: [{
                data: Object.values(data),
                backgroundColor: [
                    '#4facfe','#43e97b','#f093fb','#f5576c','#ffb347'
                ]
            }]
        },
        options
    });
});

// COURSE BAR
fetch('/reports/course')
.then(res => res.json())
.then(data => {
    new Chart(document.getElementById('courseChart'), {
        type: 'bar',
        data: {
            labels: Object.keys(data),
            datasets: [{
                label: 'Students',
                data: Object.values(data),
                backgroundColor: '#4facfe',
                borderRadius: 6
            }]
        },
        options: {
            ...options,
            scales: {
                y: { beginAtZero: true }
            }
        }
    });
});

// DAILY LINE
fetch('/reports/daily')
.then(res => res.json())
.then(data => {
    new Chart(document.getElementById('dailyChart'), {
        type: 'line',
        data: {
            labels: Object.keys(data),
            datasets: [{
                label: 'Enquiries',
                data: Object.values(data),
                borderColor: '#43e97b',
                backgroundColor: 'rgba(67,233,123,0.2)',
                fill: true,
                tension: 0.4
            }]
        },
        options
    });
});
</script>

</body>
</html>
