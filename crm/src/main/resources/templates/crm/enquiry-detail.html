<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry Details - CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; }
        .card { border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border-radius: 12px; }
        .status-badge { display: inline-block; padding: 8px 15px; border-radius: 20px; font-weight: 600; }
        .status-new { background: #e3f2fd; color: #1976d2; }
        .status-contacted { background: #f3e5f5; color: #7b1fa2; }
        .status-qualified { background: #fff3e0; color: #e65100; }
        .status-converted { background: #e8f5e9; color: #2e7d32; }
        .status-rejected { background: #ffebee; color: #c62828; }
        .timeline-item { padding-left: 50px; position: relative; margin-bottom: 30px; }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container-fluid p-4">
        <!-- NAVBAR -->
        <nav class="navbar navbar-dark bg-dark mb-4">
            <div class="container-fluid">
                <span class="navbar-brand"><i class="fas fa-envelope"></i> Enquiry Flow Management</span>
                <a href="/crm/dashboard" class="btn btn-sm btn-light">Dashboard</a>
            </div>
        </nav>

        <div class="row">
            <!-- LEFT: ENQUIRY DETAILS -->
            <div class="col-lg-5">
                <div class="card mb-4">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0"><i class="fas fa-user-circle"></i> Enquiry Details</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="text-muted small">Name</label>
                            <p class="h6" th:text="${enquiry.name}">Name</p>
                        </div>
                        <div class="mb-3">
                            <label class="text-muted small">Email</label>
                            <p class="h6" th:text="${enquiry.email}">Email</p>
                        </div>
                        <div class="mb-3">
                            <label class="text-muted small">Phone</label>
                            <p class="h6" th:text="${enquiry.phone}">Phone</p>
                        </div>
                        <div class="mb-3">
                            <label class="text-muted small">Course Interest</label>
                            <p class="h6" th:text="${enquiry.courseInterest}">Course</p>
                        </div>
                        <div class="mb-3">
                            <label class="text-muted small">Current Status</label>
                            <p>
                                <span class="status-badge" th:classappend="${'status-' + enquiry.enquiryStatus.toLowerCase()}" th:text="${enquiry.enquiryStatus}">Status</span>
                            </p>
                        </div>
                        <div class="mb-3">
                            <label class="text-muted small">Assigned To</label>
                            <p class="h6" th:text="${enquiry.assignedTo ?: 'Unassigned'}">Assigned</p>
                        </div>
                    </div>
                </div>
                <div>
                
                  <a href="/enquiry" class="btn btn-sm btn-light">back</a>
                </div>

                <!-- CONVERT TO ENROLLMENT -->
                <div class="card" th:if="${enquiry.enquiryStatus == 'Qualified' or enquiry.enquiryStatus == 'Contacted'}">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="fas fa-arrow-right"></i> Convert to Enrollment</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/crm/enroll-from-enquiry/{id}(id=${enquiry.id})}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Select Course</label>
                                <select name="courseId" class="form-select" required>
                                    <option value="">-- Select Course --</option>
                                    <option th:each="course : ${courses}" th:value="${course.id}" 
                                            th:text="${course.courseName + ' - ₹' + course.courseFees + ' (' + course.durationMonths + ' months)'}">
                                    </option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success w-100">
                                <i class="fas fa-check"></i> Enroll Student
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- RIGHT: FOLLOW-UPS TIMELINE -->
            <div class="col-lg-7">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0"><i class="fas fa-history"></i> Follow-up Timeline</h5>
                    </div>
                    <div class="card-body">
                        <div class="timeline">
                            <div th:each="followup : ${followUps}" class="timeline-item">
                                <div class="card mb-3">
                                    <div class="card-body">
                                        <div style="display: flex; justify-content: space-between; align-items: start;">
                                            <div>
                                                <h6 style="margin: 0; font-weight: 600;">
                                                    <i class="fas fa-phone" th:if="${followup.communicationMode == 'Call'}"></i>
                                                    <i class="fas fa-envelope" th:if="${followup.communicationMode == 'Email'}"></i>
                                                    <i class="fas fa-comment" th:if="${followup.communicationMode == 'SMS'}"></i>
                                                    <i class="fas fa-handshake" th:if="${followup.communicationMode == 'Meeting'}"></i>
                                                    <span th:text="${followup.communicationMode}">Mode</span>
                                                </h6>
                                                <small class="text-muted" th:text="${#temporals.format(followup.followupDate, 'dd-MM-yyyy HH:mm')}">Date</small>
                                            </div>
                                            <span class="badge" th:classappend="${'bg-' + (followup.outcome == 'Positive' ? 'success' : followup.outcome == 'Negative' ? 'danger' : 'warning')}" th:text="${followup.outcome}">Outcome</span>
                                        </div>
                                        <p class="mt-3 mb-0" th:text="${followup.notes}">Notes</p>
                                        <small class="text-muted mt-2 d-block" th:if="${followup.nextFollowupDate}">
                                            📅 Next: <span th:text="${#temporals.format(followup.nextFollowupDate, 'dd-MM-yyyy')}">Date</span>
                                        </small>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- ADD NEW FOLLOW-UP -->
                        <hr>
                        <h6 style="margin-top: 20px; margin-bottom: 15px;"><i class="fas fa-plus"></i> Add New Follow-up</h6>
                        <form th:action="@{/crm/enquiry/{id}/followup(id=${enquiry.id})}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Communication Mode *</label>
                                <select name="communicationMode" class="form-select" required>
                                    <option value="Call">☎️ Call</option>
                                    <option value="Email">✉️ Email</option>
                                    <option value="SMS">💬 SMS</option>
                                    <option value="Meeting">🤝 Meeting</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Notes *</label>
                                <textarea name="notes" class="form-control" rows="2" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Outcome *</label>
                                <select name="outcome" class="form-select" required>
                                    <option value="Positive">✓ Positive</option>
                                    <option value="Neutral">→ Neutral</option>
                                    <option value="Negative">✗ Negative</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Next Follow-up Date</label>
                                <input type="datetime-local" name="nextFollowupDate" class="form-control">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-plus"></i> Save Follow-up
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
