<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Followups</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">

    <h2 th:text="'📅 ' + ${type} + ' Followups'"></h2>

    <div class="mb-3">
        <a href="/followups/today" class="btn btn-warning">Today</a>
        <a href="/followups/overdue" class="btn btn-danger">Overdue</a>
        <a href="/followups/upcoming" class="btn btn-success">Upcoming</a>
    </div>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Enquiry</th>
                <th>Next Followup</th>
                <th>Mode</th>
                <th>Outcome</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="f : ${followups}">
                <td th:text="${f.enquiry.name}"></td>
                <td th:text="${#temporals.format(f.nextFollowupDate, 'dd-MM-yyyy HH:mm')}"></td>
                <td th:text="${f.communicationMode}"></td>
                <td th:text="${f.outcome}"></td>
                <td th:text="${f.notes}"></td>
            </tr>
        </tbody>
    </table>

</div>

</body>
</html>
