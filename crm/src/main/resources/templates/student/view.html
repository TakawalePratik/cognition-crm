<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Details - Cognition CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f5f7fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .detail-container {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            max-width: 700px;
            margin: 30px auto;
        }
        .detail-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #667eea;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }
        .detail-label {
            font-weight: 600;
            color: #333;
        }
        .detail-value {
            color: #666;
        }
        .badge-status {
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
        }
        .btn-action {
            padding: 10px 20px;
            margin: 10px 5px;
            border-radius: 5px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }
        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard">
                <i class="fas fa-graduation-cap"></i> Cognition CRM
            </a>
        </div>
    </nav>

    <!-- Detail View -->
    <div class="detail-container">
        <div class="detail-header">
            <h2 th:text="${student.name}"></h2>
            <span th:if="${student.studentStatus == 'Active'}" class="badge badge-status bg-success">
                <i class="fas fa-check-circle"></i> Active
            </span>
            <span th:if="${student.studentStatus == 'Inactive'}" class="badge badge-status bg-warning">
                <i class="fas fa-pause-circle"></i> Inactive
            </span>
            <span th:if="${student.studentStatus == 'Graduated'}" class="badge badge-status bg-info">
                <i class="fas fa-graduation-cap"></i> Graduated
            </span>
        </div>

        <div class="detail-row">
            <span class="detail-label"><i class="fas fa-id-card"></i> Student ID:</span>
            <span class="detail-value" th:text="${student.id}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label"><i class="fas fa-envelope"></i> Email:</span>
            <span class="detail-value" th:text="${student.email}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label"><i class="fas fa-phone"></i> Phone:</span>
            <span class="detail-value" th:text="${student.phone}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label"><i class="fas fa-birthday-cake"></i> Date of Birth:</span>
            <span class="detail-value" th:text="${student.dateOfBirth}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label"><i class="fas fa-book"></i> Course Enrolled:</span>
            <span class="detail-value" th:text="${student.courseEnrolled}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label"><i class="fas fa-calendar"></i> Enrollment Date:</span>
            <span class="detail-value" th:text="${#temporals.format(student.enrollmentDate, 'dd-MM-yyyy')}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label"><i class="fas fa-user-tie"></i> Guardian Name:</span>
            <span class="detail-value" th:text="${student.guardianName}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label"><i class="fas fa-phone"></i> Guardian Phone:</span>
            <span class="detail-value" th:text="${student.guardianPhone}"></span>
        </div>

        <div class="detail-row">
            <span class="detail-label"><i class="fas fa-map-marker-alt"></i> Address:</span>
            <span class="detail-value" th:text="${student.address}"></span>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <a th:href="@{/student/edit/{id}(id=${student.id})}" class="btn btn-action btn-warning">
                <i class="fas fa-edit"></i> Edit
            </a>
            <a href="/student" class="btn btn-action btn-secondary">
                <i class="fas fa-arrow-left"></i> Back to List
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
