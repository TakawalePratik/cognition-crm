<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Payment - Cognition CRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f5f7fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .form-container {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: 30px auto;
        }
        .form-title {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        .form-control {
            border-radius: 5px;
            border: 1px solid #ddd;
            padding: 10px 15px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-cancel {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            background-color: #e9ecef;
            border: none;
            color: #333;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        .btn-cancel:hover {
            background-color: #dee2e6;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard">
                <i class="fas fa-graduation-cap"></i> Cognition CRM
            </a>
        </div>
    </nav>

    <!-- Form -->
    <div class="form-container">
        <h2 class="form-title">
            <i class="fas fa-money-bill"></i> Record Payment
        </h2>

        <form th:action="@{/payment/save}" th:object="${payment}" method="post">
            <div class="form-group">
                <label for="studentId" class="form-label">Student ID *</label>
                <input type="number" class="form-control" id="studentId" th:field="*{studentId}" required>
            </div>

            <div class="form-group">
                <label for="amount" class="form-label">Amount (₹) *</label>
                <input type="number" step="0.01" class="form-control" id="amount" th:field="*{amount}" required>
            </div>

            <div class="form-group">
                <label for="paymentMethod" class="form-label">Payment Method *</label>
                <select class="form-control" id="paymentMethod" th:field="*{paymentMethod}" required>
                    <option value="">-- Select Method --</option>
                    <option value="Cash">Cash</option>
                    <option value="Card">Card</option>
                    <option value="Online Transfer">Online Transfer</option>
                    <option value="Check">Check</option>
                </select>
            </div>

            <div class="form-group">
                <label for="transactionId" class="form-label">Transaction ID</label>
                <input type="text" class="form-control" id="transactionId" th:field="*{transactionId}" placeholder="Optional">
            </div>

            <div class="form-group">
                <label for="remarks" class="form-label">Remarks</label>
                <textarea class="form-control" id="remarks" th:field="*{remarks}" rows="3" placeholder="Additional notes..."></textarea>
            </div>

            <button type="submit" class="btn-submit">
                <i class="fas fa-save"></i> Save Payment
            </button>

            <a href="/payment" class="btn-cancel">
                <i class="fas fa-arrow-left"></i> Back to List
            </a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
